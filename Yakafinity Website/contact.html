<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact & Orders | YAKAFINITY</title>
  <meta name="description" content="Contact YAKAFINITY and place your project order." />
  <link rel="icon" type="image/png" href="../admin-images/site-admin/brand/logo.png" />
  <link rel="apple-touch-icon" href="../admin-images/site-admin/brand/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html">
        <img id="brandLogo" src="../admin-images/site-admin/brand/logo.png" alt="YAKAFINITY logo" />
        <span id="brandName">YAKAFINITY</span>
      </a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="contact.html">Contact</a>
        <a href="client-portal.html">Client Login</a>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle dark mode">
          <span class="theme-icon">🌙</span>
        </button>
      </nav>
    </div>
  </header>

  <main>
    <section class="section page-hero">
      <div class="container">
        <p class="eyebrow" id="contactPageEyebrow">Contact</p>
        <h1 class="page-title" id="contactPageTitle">Send Your Project Request</h1>
        <p class="lead" id="contactPageIntro">Complete this form and we will manage your order from planning to delivery.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <form id="orderForm" class="order-form" data-order-form>
          <div class="field">
            <label for="clientName">Your Name</label>
            <input id="clientName" name="clientName" required />
          </div>
          <div class="field">
            <label for="clientEmail">Email</label>
            <input id="clientEmail" name="clientEmail" type="email" required />
          </div>
          <div class="field">
            <label for="serviceType">Service</label>
            <select id="serviceType" name="serviceType" data-service-select required></select>
          </div>
          <div class="field">
            <label for="projectBudget">Budget (USD)</label>
            <input id="projectBudget" name="projectBudget" placeholder="500 - 5000" />
          </div>
          <div class="field">
            <label for="deadline">Deadline</label>
            <input id="deadline" name="deadline" type="date" />
          </div>
          <div class="field field-full">
            <label for="details">Project Details</label>
            <textarea id="details" name="details" rows="4" required></textarea>
          </div>
          <button type="submit" class="btn">Submit Order</button>
          <p id="orderMessage" class="form-message"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-wrap">
      <p><strong id="footerName">YAKAFINITY</strong> | Premium Tech Services</p>
      <p><span id="footerDomainPrefix">Domain:</span> <span id="brandDomain">www.yakafinity.com</span></p>
    </div>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
  <script>
    // Theme toggle functionality
    const html = document.documentElement;
    const themeToggle = document.querySelector('[data-theme-toggle]');
    const themeKey = 'yakafinity-theme';

    // Load saved theme or use system preference
    function initTheme() {
      let savedTheme = localStorage.getItem(themeKey);
      if (!savedTheme) {
        savedTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      html.setAttribute('data-theme', savedTheme);
      updateToggleIcon(savedTheme);
    }

    // Update icon based on theme
    function updateToggleIcon(theme) {
      const icon = themeToggle.querySelector('.theme-icon');
      icon.textContent = theme === 'dark' ? '☀️' : '🌙';
    }

    // Toggle theme
    function toggleTheme() {
      const currentTheme = html.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', newTheme);
      localStorage.setItem(themeKey, newTheme);
      updateToggleIcon(newTheme);
    }

    // Initialize
    initTheme();
    themeToggle.addEventListener('click', toggleTheme);

    // Listen to system theme changes
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
      if (!localStorage.getItem(themeKey)) {
        const newTheme = e.matches ? 'dark' : 'light';
        html.setAttribute('data-theme', newTheme);
        updateToggleIcon(newTheme);
      }
    });
  </script>
</body>
</html>
