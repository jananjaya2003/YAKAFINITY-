<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Detail | Tharindu J Bandara</title>
  <meta
    name="description"
    content="View the full description and screenshot of a selected project from Tharindu J Bandara's portfolio."
  >
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="site-body">
  <div class="page-noise" aria-hidden="true"></div>
  <header class="site-header">
    <div class="brand-block">
      <span class="brand-kicker">Portfolio</span>
      <a href="index.html" class="brand-name" id="site-brand-name">Tharindu J Bandara</a>
    </div>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="projects.html">Projects</a>
      <a href="media.html">Media</a>
      <a href="index.html#contact">Contact</a>
    </nav>
    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle dark mode">
      <span class="theme-toggle-track">
        <span class="theme-toggle-thumb"></span>
      </span>
      <span class="theme-toggle-label">Dark Mode</span>
    </button>
  </header>

  <main id="project-detail-page">
    <section class="section-shell archive-hero">
      <div class="archive-copy panel-card">
        <p class="eyebrow" id="project-detail-eyebrow">Project</p>
        <h1 id="project-detail-title">Project Title</h1>
        <p id="project-detail-summary">Project summary</p>
        <div class="hero-actions">
          <a class="button button-secondary" href="projects.html">Back to Projects</a>
          <a class="button button-primary" id="project-detail-live-link" href="#" target="_blank" rel="noreferrer">Open Project</a>
        </div>
      </div>
    </section>

    <section class="section-shell">
      <div class="project-detail-layout">
        <article class="project-detail-visual panel-card">
          <p class="eyebrow" id="project-detail-shot-label">Project Screenshot</p>
          <img id="project-detail-image" src="" alt="Project screenshot">
        </article>
        <article class="project-detail-info panel-card">
          <p class="eyebrow">Description</p>
          <h2>Project Overview</h2>
          <p id="project-detail-description"></p>
          <div class="tag-row project-detail-tags" id="project-detail-tags"></div>
          <div class="project-documents" id="project-detail-documents-section" hidden>
            <p class="eyebrow">Documents</p>
            <div class="project-documents-list" id="project-detail-documents"></div>
          </div>
        </article>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p id="footer-copy">Portfolio of Tharindu J Bandara.</p>
  </footer>

  <script src="content.js"></script>
  <script src="theme.js"></script>
  <script src="header.js"></script>
  <script src="app.js"></script>
</body>
</html>
