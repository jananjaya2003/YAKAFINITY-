<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Admin Login | Tharindu J Bandara</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="admin-body">
  <div class="page-noise" aria-hidden="true"></div>
  <header class="site-header admin-header">
    <div class="brand-block">
      <span class="brand-kicker">Portfolio Admin</span>
      <a href="index.html" class="brand-name">Tharindu J Bandara</a>
    </div>
    <div class="header-actions">
      <a class="manage-link" href="index.html">View Website</a>
    </div>
  </header>

  <main class="admin-main">
    <section class="panel-card admin-hero login-shell">
      <div>
        <p class="eyebrow">Protected Access</p>
        <h1>Portfolio Admin Login</h1>
        <p>Use the shared admin username and password to manage portfolio content and resume files.</p>
      </div>
      <form id="portfolioLoginForm" class="form-grid">
        <label>
          <span>Username</span>
          <input id="portfolioAdminUser" autocomplete="username" required>
        </label>
        <label>
          <span>Password</span>
          <input id="portfolioAdminPass" type="password" autocomplete="current-password" required>
        </label>
        <button class="button button-primary" type="submit">Login to Portfolio Admin</button>
        <p class="status-text" id="portfolioLoginMessage"></p>
      </form>
    </section>
  </main>

  <script src="../Yakafinity Website/data.js"></script>
  <script src="manage-login.js"></script>
</body>
</html>
