<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frame Gallery | Tharindu J Bandara</title>
  <meta
    name="description"
    content="View all images inside a selected frame gallery from the portfolio of Tharindu J Bandara."
  >
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="site-body">
  <div class="page-noise" aria-hidden="true"></div>
  <header class="site-header">
    <div class="brand-block">
      <span class="brand-kicker">Portfolio</span>
      <a href="index.html" class="brand-name" id="site-brand-name">Tharindu J Bandara</a>
    </div>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="projects.html">Projects</a>
      <a href="media.html">Media</a>
      <a href="index.html#contact">Contact</a>
    </nav>
    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle dark mode">
      <span class="theme-toggle-track">
        <span class="theme-toggle-thumb"></span>
      </span>
      <span class="theme-toggle-label">Dark Mode</span>
    </button>
  </header>

  <main id="frame-detail-page">
    <section class="section-shell archive-hero">
      <div class="archive-copy panel-card">
        <p class="eyebrow" id="frame-detail-eyebrow">Gallery</p>
        <h1 id="frame-detail-title">Frame Gallery</h1>
        <p id="frame-detail-summary">See all images inside this frame.</p>
        <p id="frame-detail-description">Frame description</p>
        <div class="hero-actions">
          <a class="button button-secondary" href="media.html">Back to Media</a>
          <span class="section-link" id="frame-detail-count">0 images</span>
        </div>
      </div>
    </section>

    <section class="section-shell">
      <div class="frame-detail-grid" id="frame-detail-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p id="footer-copy">Portfolio of Tharindu J Bandara.</p>
  </footer>

  <script src="content.js"></script>
  <script src="theme.js"></script>
  <script src="header.js"></script>
  <script src="app.js"></script>
</body>
</html>
