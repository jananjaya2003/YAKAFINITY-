<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YAKAFINITY Admin Login</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" type="image/png" href="../admin-images/site-admin/brand/logo.png" />
  <link rel="apple-touch-icon" href="../admin-images/site-admin/brand/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="admin-body">
  <header class="site-header admin-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html">
        <img src="../admin-images/site-admin/brand/logo.png" alt="YAKAFINITY logo" />
        <span>YAKAFINITY</span>
      </a>
      <nav class="nav-links">
        <a href="index.html">Back to Site</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <section class="admin-card login-card">
        <p class="eyebrow">Protected Access</p>
        <h1>Admin Login</h1>
        <p class="muted">Only authorized administrators can access website management.</p>
        <form id="adminLoginForm" class="admin-grid-form login-form">
          <div class="field field-full">
            <label for="adminUser">Username</label>
            <input id="adminUser" autocomplete="username" required />
          </div>
          <div class="field field-full">
            <label for="adminPass">Password</label>
            <input id="adminPass" type="password" autocomplete="current-password" required />
          </div>
          <button class="btn" type="submit">Login to Admin</button>
          <p id="adminLoginMessage" class="form-message"></p>
        </form>
      </section>
    </div>
  </main>

  <script src="data.js"></script>
  <script src="admin-login.js"></script>
</body>
</html>
